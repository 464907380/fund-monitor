<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>基金优选 · FundSelect</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #08080f;
  color: #c8c8d0;
  font-family: 'Inter','SF Pro Display','PingFang SC','Microsoft YaHei',Arial,sans-serif;
  font-size: 14px; min-height: 100vh; overflow-x: hidden;
}
/* 动态网格背景 */
body::before {
  content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background-image:
    linear-gradient(rgba(66,165,245,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(66,165,245,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none; z-index: 0;
}
/* 光晕效果 */
body::after {
  content: ''; position: fixed; top: -50%; left: -50%; right: -50%; bottom: -50%;
  background: radial-gradient(ellipse at 20% 30%, rgba(66,165,245,0.04) 0%, transparent 50%),
              radial-gradient(ellipse at 80% 70%, rgba(102,187,106,0.03) 0%, transparent 50%);
  pointer-events: none; z-index: 0;
  animation: bgShift 20s ease-in-out infinite;
}
@keyframes bgShift {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(2%, 1%); }
}
.container { max-width: 1000px; margin: 0 auto; padding: 32px 24px; position: relative; z-index: 1; }

/* 标题 — 终端风格 */
header {
  text-align: center; margin-bottom: 32px;
  position: relative;
}
header::after {
  content: ''; display: block; width: 60px; height: 2px;
  background: linear-gradient(90deg, transparent, #42a5f5, transparent);
  margin: 16px auto 0; border-radius: 1px;
  opacity: 0.6;
}
h1 {
  font-size: 28px; font-weight: 700; letter-spacing: 3px;
  background: linear-gradient(135deg, #66bb6a, #42a5f5, #7c4dff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.subtitle {
  font-family: 'Consolas',monospace;
  font-size: 12px; color: rgba(102,187,106,0.4); margin-top: 6px;
  letter-spacing: 6px; text-transform: uppercase;
}

/* 卡片 — 玻璃质感+发光边框 */
.card {
  background: rgba(18,18,30,0.85);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 14px;
  padding: 20px 22px;
  margin-bottom: 18px;
  box-shadow: 0 4px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.03);
  overflow: visible;
  transition: border-color 0.3s, box-shadow 0.3s;
}
.card:hover {
  border-color: rgba(66,165,245,0.12);
  box-shadow: 0 4px 32px rgba(0,0,0,0.5), 0 0 40px rgba(66,165,245,0.03), inset 0 1px 0 rgba(255,255,255,0.03);
}

/* 输入框通用 */
input, select, button { font-family: inherit; outline: none; }

/* 添加区域 */
.add-card { position: relative; z-index: 10; }
.add-section label {
  display: block; font-size: 12px; color: #888; margin-bottom: 8px;
  letter-spacing: 1px; text-transform: uppercase;
}
.add-row { display: flex; gap: 10px; }
.search-wrap { position: relative; flex: 1; }
.search-wrap input {
  width: 100%; background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08); border-radius: 8px;
  color: #e0e0e0; padding: 10px 14px; font-size: 15px;
  transition: border-color 0.25s, box-shadow 0.25s;
}
.search-wrap input:focus { border-color: #66bb6a; box-shadow: 0 0 0 3px rgba(102,187,106,0.1); }
.search-wrap input::placeholder { color: #333; }
.suggestions {
  position: absolute; top: 100%; left: 0; right: 0; z-index: 9999;
  background: #141428; border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px; margin-top: 6px; max-height: 240px; overflow-y: auto;
  display: none; box-shadow: 0 12px 48px rgba(0,0,0,0.6);
}
.suggestions.show { display: block; }
.suggestions .item {
  padding: 10px 14px; cursor: pointer; display: flex; justify-content: space-between;
  align-items: center; transition: background 0.15s;
}
.suggestions .item:hover { background: rgba(102,187,106,0.08); }
.suggestions .item .scode { font-family: 'Consolas',monospace; font-size: 11px; color: #555; }
.suggestions .item .sname { font-size: 14px; color: #ccc; }
.add-row button, .toolbar-btn {
  background: linear-gradient(135deg, #66bb6a, #43a047);
  color: #fff; border: none; border-radius: 8px;
  padding: 10px 22px; font-size: 13px; cursor: pointer; font-weight: 600;
  transition: transform 0.15s, box-shadow 0.2s;
  position: relative; overflow: hidden;
}
.add-row button:hover, .toolbar-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(102,187,106,0.25); }
.add-row button:active, .toolbar-btn:active { transform: translateY(0); }

/* 列表头 */
.list-header {
  display: flex; justify-content: space-between; align-items: center;
  padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.05);
  font-size: 13px; color: #888; letter-spacing: 1px;
}
.list-header .count { color: #888; font-weight: 600; }

/* 基金行 */
.fund-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 4px;
  border-bottom: 1px solid rgba(255,255,255,0.02);
  transition: background 0.15s, padding-left 0.15s;
}
.fund-row:last-child { border-bottom: none; }
.fund-row:hover {
  background: linear-gradient(90deg, rgba(66,165,245,0.03), transparent);
  border-radius: 6px; padding-left: 8px;
}
.fund-row .info { display: flex; flex-direction: column; gap: 2px; }
.fund-row .code {
  font-family: 'Consolas',monospace;
  font-size: 12px; color: #555; letter-spacing: 1px;
}
.fund-row .name {
  font-size: 14px; font-weight: 600; color: #e8e8e8;
  letter-spacing: 0.3px;
}
.fund-row .del-btn {
  background: rgba(239,83,80,0.08);
  border: 1px solid rgba(239,83,80,0.2);
  border-radius: 6px;
  color: #ef5350; padding: 6px 14px; font-size: 12px; cursor: pointer;
  transition: all 0.2s; font-weight: 500;
}
.fund-row .del-btn:hover {
  background: #ef5350; color: #fff; border-color: #ef5350;
  box-shadow: 0 2px 12px rgba(239,83,80,0.3);
}

/* 消息 */
.msg {
  padding: 12px 18px; border-radius: 10px; margin-bottom: 16px;
  font-size: 13px; display: none; animation: msgIn 0.25s ease-out;
  border: 1px solid transparent;
}
.msg.ok {
  display: block;
  background: rgba(102,187,106,0.08);
  color: #81c784;
  border-color: rgba(102,187,106,0.15);
}
.msg.err, .msg.fail {
  display: block;
  background: rgba(239,83,80,0.08);
  color: #ef9a9a;
  border-color: rgba(239,83,80,0.15);
}
@keyframes msgIn {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* 功能概览 */
.feature-row {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 4px;
  border-bottom: 1px solid rgba(255,255,255,0.02);
  transition: background 0.15s, padding-left 0.15s;
}
.feature-row:last-child { border-bottom: none; }
.feature-row:hover {
  background: linear-gradient(90deg, rgba(66,165,245,0.03), transparent);
  border-radius: 8px; padding-left: 8px;
}
.feature-icon { font-size: 24px; width: 36px; text-align: center; flex-shrink: 0; }
.feature-body { flex: 1; min-width: 0; }
.feature-name { font-size: 15px; font-weight: 600; color: #e0e0e0; }
.feature-desc { font-size: 12px; color: #777; margin-top: 3px; line-height: 1.5; }
.feature-info { font-size: 11px; color: #555; margin-top: 3px; font-family: 'Consolas',monospace; }
.feature-meta { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.feature-time {
  font-size: 11px; color: #555; white-space: nowrap;
  font-family: 'Consolas',monospace; letter-spacing: 0.3px;
}
.feature-status { display: inline-block; width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.feature-status.ok { background: #66bb6a; box-shadow: 0 0 8px rgba(102,187,106,0.4); }
.feature-status.fail { background: #ef5350; box-shadow: 0 0 8px rgba(239,83,80,0.4); }

.task-actions { display: inline-flex; gap: 4px; margin-left: 4px; vertical-align: middle; }
.task-btn {
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 5px; color: #888; cursor: pointer; font-size: 11px;
  padding: 3px 9px; line-height: 1.5; transition: all 0.2s;
}
.task-btn:hover { background: rgba(255,255,255,0.1); }
.task-btn:active { transform: scale(0.92); }
.start-btn:hover { color: #66bb6a; border-color: #66bb6a; box-shadow: 0 0 12px rgba(102,187,106,0.15); }
.stop-btn:hover { color: #ef5350; border-color: #ef5350; box-shadow: 0 0 12px rgba(239,83,80,0.15); }

.timer-badge {
  display: inline-block; padding: 2px 10px; border-radius: 8px;
  font-size: 10px; font-weight: 600; white-space: nowrap;
  letter-spacing: 0.5px; margin-left: 4px; vertical-align: middle;
  text-transform: uppercase;
}
.timer-badge.enabled {
  background: rgba(66,165,245,0.12); color: #42a5f5;
  border: 1px solid rgba(66,165,245,0.2);
}
.timer-badge.running {
  background: rgba(102,187,106,0.12); color: #66bb6a;
  border: 1px solid rgba(102,187,106,0.2);
}
.timer-badge.disabled {
  background: rgba(255,255,255,0.04); color: #555;
  border: 1px solid rgba(255,255,255,0.06);
}

.empty {
  text-align: center; padding: 48px 16px;
  color: #444; font-size: 14px; letter-spacing: 1px;
}

/* 底部 */
.footer {
  text-align: center; font-size: 11px; color: #222;
  margin-top: 32px; letter-spacing: 3px;
  font-family: 'Consolas',monospace;
}

/* 自定义滚动条 */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }

/* 弹窗 */
.modal-overlay {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(6px);
  justify-content: center; align-items: center; z-index: 100;
}
.modal-overlay.show { display: flex; }
.modal-box {
  background: #1a1a2e; border: 1px solid rgba(255,255,255,0.06);
  border-radius: 14px; padding: 28px; max-width: 360px; width: 90%;
  box-shadow: 0 12px 48px rgba(0,0,0,0.5);
}
.modal-box p { margin-bottom: 20px; color: #ccc; font-size: 15px; text-align: center; }
.modal-box .code-big {
  display: block; font-size: 22px; font-weight: 700;
  color: #e0e0e0; text-align: center; margin-bottom: 4px;
  font-family: 'Consolas',monospace;
}
.modal-box .name-big {
  display: block; font-size: 13px; color: #777; text-align: center; margin-bottom: 16px;
}
.modal-actions { display: flex; gap: 10px; }
.modal-actions button {
  flex: 1; padding: 10px; border: none; border-radius: 8px;
  font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.15s;
}
.modal-actions .btn-cancel {
  background: rgba(255,255,255,0.05); color: #999;
  border: 1px solid rgba(255,255,255,0.08);
}
.modal-actions .btn-cancel:hover { background: rgba(255,255,255,0.1); }
.modal-actions .btn-confirm {
  background: linear-gradient(135deg, #ef5350, #e53935); color: #fff;
}
.modal-actions .btn-confirm:hover { box-shadow: 0 4px 12px rgba(239,83,80,0.3); }

/* 渐变分割线 */
.divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(102,187,106,0.2), rgba(66,165,245,0.2), transparent);
  margin: 8px 0 16px;
}

/* 顶部工具栏 */
.toolbar {
  display: flex;
  gap: 10px;
  padding: 12px 16px;
  background: rgba(255,255,255,0.03);
  border-radius: 8px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.toolbar-btn-wrap {
  position: relative;
  overflow: hidden;
  border-radius: 6px;
  flex: 0 1 auto;
}
.toolbar-btn {
  padding: 8px 18px;
  font-size: 13px;
  font-weight: 600;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.toolbar-btn:disabled { opacity: 0.6; cursor: not-allowed; }
.toolbar-btn.blue { background: linear-gradient(135deg,#42a5f5,#1e88e5); color: #fff; }
.toolbar-btn.green { background: linear-gradient(135deg,#66bb6a,#43a047); color: #fff; }
.btn-progress {
  position: absolute;
  bottom: 0;
  left: 0;
  height: 3px;
  width: 0%;
  background: linear-gradient(90deg, #66bb6a, #42a5f5);
  transition: width 0.5s ease;
  border-radius: 0 0 6px 6px;
}
.btn-progress.pulse {
  width: 30%;
  animation: pulseWidth 1.5s ease-in-out infinite;
}
@keyframes pulseWidth {
  0% { width: 10%; opacity: 0.6; }
  50% { width: 60%; opacity: 1; }
  100% { width: 10%; opacity: 0.6; }
}
</style>
</head>
<body>
<div class="container" id="app">

  <header>
    <h1>📋 基金优选</h1>
    <div class="subtitle">FUND SELECT</div>
  </header>

  <div id="msg" class="msg"></div>

  <!-- 📊 大盘看板 -->
  <div class="card" id="marketBoard" style="display:none;">
    <div class="divider"></div>
    <div style="padding:12px 14px 8px;font-size:13px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
        <span style="font-weight:600;color:#ccc;font-size:14px;">🇨🇳 中国股市</span>
        <span id="marketTime" style="font-size:11px;color:#555;"></span>
      </div>
      <div id="marketIndices" style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;"></div>
    </div>
  </div>

  <div class="card" id="fundFullTableCard">
    <div class="divider"></div>
    <div style="display:flex;align-items:center;gap:8px;padding:8px 10px 0;">
      <span style="font-size:13px;font-weight:600;color:#ccc;flex:1;">📊 自选基金完整数据</span>
      <span id="fundAutoRefreshStatus" style="font-size:11px;color:#555;"></span>
      <select id="fundRefreshInterval" onchange="_saveRefreshInterval()" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:4px;color:#888;padding:2px 4px;font-size:11px;cursor:pointer;">
        <option value="60">1分钟</option>
        <option value="120">2分钟</option>
        <option value="300">5分钟</option>
        <option value="600" selected>10分钟</option>
        <option value="1800">30分钟</option>
      </select>
      <button onclick="toggleAutoRefresh()" id="fundAutoRefreshBtn" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:4px;color:#888;padding:3px 10px;font-size:11px;cursor:pointer;">🔄 自动刷新</button>
    </div>
    <div id="fundFullTable" style="padding:0;font-size:12px;color:#666;"><p style="padding:12px 4px;">⏳ 加载中…</p></div>
  </div>

  <div class="card" id="recommendFullTableCard">
    <div class="divider"></div>
    <div id="recommendFullTable" style="padding:0;font-size:12px;color:#666;"><p style="padding:12px 4px;">⏳ 加载中…</p></div>
  </div>

  <div class="card">
    <div class="list-header">
      <span>⚙️ 评分维度</span>
    </div>
    <div class="divider"></div>
    <!-- 预设栏 -->
    <div style="display:flex;align-items:center;gap:8px;padding:8px 4px 12px;border-bottom:1px solid rgba(255,255,255,0.06);margin-bottom:8px;flex-wrap:wrap;">
      <span style="font-size:12px;color:#888;white-space:nowrap;">📁 预设</span>
      <select id="presetSelect" style="flex:1;min-width:100px;max-width:180px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.15);border-radius:4px;color:#ccc;padding:4px 6px;font-size:12px;"></select>
      <button onclick="loadPreset()" style="background:rgba(255,255,255,0.08);color:#ccc;border:1px solid rgba(255,255,255,0.15);border-radius:4px;padding:4px 12px;font-size:12px;cursor:pointer;">📂 加载</button>
      <button onclick="savePreset()" style="background:rgba(255,255,255,0.08);color:#ccc;border:1px solid rgba(255,255,255,0.15);border-radius:4px;padding:4px 12px;font-size:12px;cursor:pointer;">💾 覆盖</button>
      <button onclick="saveAsPreset()" style="background:rgba(255,255,255,0.08);color:#ccc;border:1px solid rgba(255,255,255,0.15);border-radius:4px;padding:4px 12px;font-size:12px;cursor:pointer;">📝 另存为</button>
      <button onclick="deletePreset()" style="background:rgba(255,255,255,0.08);color:#ef5350;border:1px solid rgba(255,255,255,0.15);border-radius:4px;padding:4px 12px;font-size:12px;cursor:pointer;">🗑</button>
    </div>
    <div id="dimsList" style="font-size:12px;"></div>
    <div style="padding:12px 4px 0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center;">
      <button onclick="saveDims()" id="dimsSaveBtn" style="background:linear-gradient(135deg,#66bb6a,#43a047);border:none;border-radius:6px;color:#fff;padding:8px 20px;font-size:13px;cursor:pointer;" class="dims-save-btn">💾 保存权重</button>
      <button onclick="resetDims()" style="background:rgba(255,255,255,0.08);color:#ccc;border:1px solid rgba(255,255,255,0.15);border-radius:6px;padding:8px 20px;font-size:13px;cursor:pointer;">重置</button>
      <button onclick="calibrateCurves()" id="calibrateBtn" style="background:linear-gradient(135deg,#ffa726,#f57c00);border:none;border-radius:6px;color:#fff;padding:8px 20px;font-size:13px;cursor:pointer;">📐 自动校准</button>
    </div>
    <div id="saveProgressArea" style="padding:6px 4px 2px;display:none;">
      <div style="display:flex;align-items:center;gap:8px;font-size:11px;color:#888;">
        <div style="flex:1;height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden;">
          <div id="saveProgressFill" style="width:0%;height:100%;background:linear-gradient(90deg,#66bb6a,#42a5f5);border-radius:3px;transition:width 0.5s;"></div>
        </div>
        <span id="saveProgressPct" style="font-family:Consolas;min-width:36px;text-align:right;">0%</span>
      </div>
      <div id="saveProgressText" style="font-size:11px;color:#888;padding:2px 0 0;"></div>
    </div>
    <div style="padding:2px 4px 0;font-size:11px;color:#555;text-align:center;">· 取消勾选 = 关闭维度，保存后下次评分生效</div>

    <div class="divider" style="margin:12px 0 8px;"></div>
    <div style="padding:0 4px;">
      <div style="font-size:13px;font-weight:600;color:#ccc;margin-bottom:10px;">🔍 全市场筛选</div>
      <div style="display:flex;flex-direction:column;gap:10px;font-size:12px;">
        <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
          <span style="color:#888;">筛选条件</span>
          <div id="filterConditions" style="display:inline-flex;flex-direction:column;gap:4px;">
            <div style="display:flex;gap:4px;align-items:center;">
              <select class="condField" style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.15);border-radius:4px;color:#e0e0e0;padding:4px 8px;font-family:Consolas;">
                <option value="y1">近1年收益</option>
                <option value="sy6">近6月收益</option>
                <option value="m3">近3月收益</option>
                <option value="m1">近1月收益</option>
                <option value="sy2">近2年收益</option>
                <option value="sy3">近3年收益</option>
              </select>
              <select class="condOp" style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.15);border-radius:4px;color:#e0e0e0;padding:4px 8px;font-family:Consolas;">
                <option value="gte">≥</option>
                <option value="lte">≤</option>
              </select>
              <input type="number" class="condVal" value="20" min="0" style="width:60px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.15);border-radius:4px;color:#e0e0e0;padding:4px 8px;font-family:Consolas;">
              <span style="color:#888;font-size:12px;">%</span>
              <button onclick="this.parentElement.parentElement.remove()" style="background:none;border:none;color:#ef5350;cursor:pointer;font-size:16px;padding:2px 6px;line-height:1;" title="删除条件">✕</button>
            </div>
          </div>
          <button onclick="addFilterCondition()" style="background:rgba(255,255,255,0.06);border:1px dashed rgba(255,255,255,0.2);border-radius:4px;color:#999;padding:4px 12px;font-size:12px;cursor:pointer;">+ 添加条件</button>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;">
          <label style="color:#888;">拉取数量
            <input type="number" id="recTopN" value="200" min="50" max="99999" style="width:70px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.15);border-radius:4px;color:#e0e0e0;padding:4px 8px;margin-left:4px;font-family:Consolas;">
          </label>
          <label style="color:#888;">展示条数
            <input type="number" id="recShowTop" value="20" min="5" max="99999" style="width:60px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.15);border-radius:4px;color:#e0e0e0;padding:4px 8px;margin-left:4px;font-family:Consolas;">
          </label>
          <label style="color:#888;">排序方式
            <select id="recRankSort" style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.15);border-radius:4px;color:#e0e0e0;padding:4px 8px;margin-left:4px;font-family:Consolas;">
              <option value="1n">近1年收益</option>
              <option value="6n">近6月收益</option>
              <option value="3y">近3月收益</option>
              <option value="1y">近1月收益</option>
              <option value="2n">近2年收益</option>
              <option value="3n">近3年收益</option>
              <option value="zn">今年来</option>
            </select>
          </label>
          <label style="color:#888;display:flex;align-items:center;gap:4px;cursor:pointer;" title="筛掉近1月/3月/6月/1年/2年/3年/近一周/年化收益中任一数据缺失的基金（sy2/sy3=0也视为缺失）">
            <input type="checkbox" id="recSkipMissingPerf" checked style="accent-color:#42a5f5;"> 筛掉缺失收益数据
          </label>
          <label style="color:#888;display:flex;align-items:center;gap:4px;cursor:pointer;">
            <input type="checkbox" id="recSkipLimited" style="accent-color:#42a5f5;"> 筛掉单日限购≤2万
          </label>
        </div>
      </div>
      <div style="margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <button onclick="runRecommendFromFilter()" id="recFilterBtn" style="background:linear-gradient(135deg,#42a5f5,#1e88e5);border:none;border-radius:6px;color:#fff;padding:8px 20px;font-size:13px;cursor:pointer;">▶ 运行推荐</button>
        <button onclick="cancelRecommend()" id="recCancelBtn" style="display:none;background:linear-gradient(135deg,#ef5350,#d32f2f);border:none;border-radius:6px;color:#fff;padding:8px 20px;font-size:13px;cursor:pointer;">✖ 取消</button>
        <div style="flex:1;max-width:200px;">
          <div style="height:4px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden;">
            <div id="recFilterProgress" style="width:0%;height:100%;background:linear-gradient(90deg,#66bb6a,#42a5f5);border-radius:2px;transition:width 0.5s;"></div>
          </div>
        </div>
        <span id="recFilterStatus" style="font-size:11px;color:#888;"></span>
      </div>
    </div>
  </div>

  <!-- ⚙️ 盘中监控阈值设置 -->
  <div class="card">
    <div style="display:flex;align-items:center;gap:8px;padding:4px 0;">
      <span style="font-size:13px;font-weight:600;color:#ccc;">🔔 盘中监控阈值</span>
      <span style="font-size:11px;color:#666;cursor:pointer;" onclick="loadMonitorConfig()">⟳ 刷新</span>
    </div>
    <div class="divider"></div>
    <div style="font-size:12px;color:#888;padding:4px 0;" id="monitorConfigArea">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <div>
          <label style="color:#888;">基金单次急跌</label>
          <input type="number" id="mc_alert_drop_once" value="-3" step="0.5" style="width:70px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:4px;color:#ef5350;padding:4px 8px;font-family:Consolas;"> %
        </div>
        <div>
          <label style="color:#888;">基金单次急涨</label>
          <input type="number" id="mc_alert_jump_once" value="5" step="0.5" style="width:70px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:4px;color:#66bb6a;padding:4px 8px;font-family:Consolas;"> %
        </div>
        <div>
          <label style="color:#888;">基金累计跌超</label>
          <input type="number" id="mc_alert_accum_drop" value="-7" step="1" style="width:70px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:4px;color:#ef5350;padding:4px 8px;font-family:Consolas;"> %
        </div>
        <div>
          <label style="color:#888;">基金累计涨超</label>
          <input type="number" id="mc_accum_jump" value="10" step="1" style="width:70px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:4px;color:#66bb6a;padding:4px 8px;font-family:Consolas;"> %
        </div>
        <div>
          <label style="color:#888;">个股单次急跌</label>
          <input type="number" id="mc_stock_drop_red" value="-5" step="0.5" style="width:70px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:4px;color:#ef5350;padding:4px 8px;font-family:Consolas;"> %
        </div>
        <div>
          <label style="color:#888;">个股单次急涨</label>
          <input type="number" id="mc_stock_jump_red" value="7" step="0.5" style="width:70px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:4px;color:#66bb6a;padding:4px 8px;font-family:Consolas;"> %
        </div>
        <div>
          <label style="color:#888;">个股累计跌超</label>
          <input type="number" id="mc_stock_accum_drop_red" value="-10" step="1" style="width:70px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:4px;color:#ef5350;padding:4px 8px;font-family:Consolas;"> %
        </div>
        <div>
          <label style="color:#888;">个股累计涨超</label>
          <input type="number" id="mc_stock_accum_jump_red" value="12" step="1" style="width:70px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:4px;color:#66bb6a;padding:4px 8px;font-family:Consolas;"> %
        </div>
        <div>
          <label style="color:#888;">轮询间隔</label>
          <select id="mc_poll_interval" style="width:80px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:4px;color:#ccc;padding:4px 6px;font-size:12px;">
            <option value="60">1分钟</option>
            <option value="300">5分钟</option>
            <option value="600" selected>10分钟</option>
            <option value="900">15分钟</option>
          </select>
        </div>
      </div>
      <div style="margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <button onclick="saveMonitorConfig()" style="background:linear-gradient(135deg,#42a5f5,#1e88e5);border:none;border-radius:6px;color:#fff;padding:6px 16px;font-size:12px;cursor:pointer;">💾 保存阈值</button>
        <button onclick="openPushConfig()" style="background:linear-gradient(135deg,#7e57c2,#5e35b1);border:none;border-radius:6px;color:#fff;padding:6px 16px;font-size:12px;cursor:pointer;">📮 推送配置</button>
        <span id="mcSaveStatus" style="font-size:11px;color:#888;"></span>
      </div>
    </div>
  </div>

  <div class="card add-card">
    <div class="add-section">
      <label>✦ 添加基金（多个用空格/逗号分隔）</label>
      <div class="add-row">
        <div class="search-wrap">
          <input id="addInput" type="text" placeholder="输入代码或名称搜索…" autocomplete="off" spellcheck="false">
          <div class="suggestions" id="suggestions"></div>
        </div>
        <button onclick="addFunds()">添加</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="list-header">
      <span>监控列表</span>
      <span class="count" id="count">0 只</span>
    </div>
    <div class="divider"></div>
    <div id="list"></div>
  </div>


  <div class="card">
    <div class="list-header">
      <span>功能概览</span>
    </div>
    <div class="divider"></div>
    <div id="features"></div>
  </div>

</div>

<!-- 确认弹窗 -->
<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <span class="code-big" id="modalCode"></span>
    <span class="name-big" id="modalName"></span>
    <p>确定从监控中移除吗？</p>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn-confirm" onclick="confirmRemove()">确认移除</button>
    </div>
  </div>
</div>

<script src="fund_manage.js"></script>
</body>
</html>
